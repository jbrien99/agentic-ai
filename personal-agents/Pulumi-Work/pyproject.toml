[project]
name = "pulumi-work"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "John Brien", email = "jbrienpop@gmail.com" }
]
requires-python = ">=3.12.12"
dependencies = [
    "asyncio>=4.0.0",
    "openai>=3.31.0",
    "openai-agents>=0.24.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
pulumi-work = "pulumi_work:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
